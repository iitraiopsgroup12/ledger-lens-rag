[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-mcp-pipeline"
version = "0.1.0"
description = "Production-ready RAG pipeline with MCP server integration"
requires-python = ">=3.14"
authors = [
    {name = "RAG Pipeline Team"}
]
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings",
    "httpx",
    "anthropic",
    "openai",
    "numpy",
    "python-dotenv",
    "tenacity",
    "faiss-cpu>=1.14.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "respx",
]

[tool.ruff]
line-length = 100
target-version = "py314"
select = ["E", "F", "I", "UP"]

[tool.ruff.isort]
known-first-party = ["rag_mcp"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --tb=short"
markers = [
    "asyncio: marks tests as async",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mcp"]

