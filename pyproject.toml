[project]
name = "ledger-lens-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "faiss-cpu>=1.8.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.3.0",
    "langchain-voyageai>=0.1.0",
    "langchain-google-genai>=2.0.0",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=2.0.0",
    "torch>=2.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "pandas>=2.0.0",
    "boto3>=1.43.36",
    "py-xbrl>=3.0.3",
]

[dependency-groups]
# Test-only deps. Excluded from the production image (Dockerfile uses `uv sync --no-dev`).
dev = [
    "pytest>=8.2.0",
]

# Install the CPU-only build of PyTorch instead of the default CUDA build. The
# CUDA build pulls the full NVIDIA toolkit (~1GB+ of nvidia-* wheels + triton),
# which this app never uses (faiss-cpu + CPU embeddings only).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
