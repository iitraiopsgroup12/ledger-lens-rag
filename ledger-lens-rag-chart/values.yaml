# Default values for ledger-lens-rag-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: localhost/ledger-lens-rag
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.4"

# Port the application listens on inside the container (see main.py / PORT env var).
containerPort: 8080

# Plain (non-secret) environment variables for the container.
# Mirrors the non-secret items in .env. Secret values (API keys, DB password)
# are declared under secretEnv below and injected via envFrom.
env:
  # Logging verbosity: DEBUG | INFO | WARNING | ERROR | CRITICAL
  LOG_LEVEL: "DEBUG"

  # CORS allowed origins: "*" (any client) or a comma-separated list, e.g.
  # "https://app.example.com,https://admin.example.com". Credentials are
  # auto-disabled when this is "*" (browser requirement).
  CORS_ALLOW_ORIGINS: "*"

  # Provider selection: "openai" | "anthropic" | "google" | "huggingface"
  LLM_PROVIDER: "anthropic"

  # Embedding provider, independent of LLM_PROVIDER so you can mix stacks (e.g.
  # Anthropic LLM + OpenAI embeddings). Leave empty to follow LLM_PROVIDER.
  EMBEDDING_PROVIDER: "huggingface"

  # OpenAI
  EMBEDDING_MODEL: "text-embedding-3-small"
  LLM_MODEL: "gpt-4o-mini"

  # Anthropic
  ANTHROPIC_LLM_MODEL: "claude-opus-4-8"
  ANTHROPIC_EMBEDDING_MODEL: "voyage-3"

  # Google
  GOOGLE_LLM_MODEL: "gemini-2.0-flash"
  GOOGLE_EMBEDDING_MODEL: "models/text-embedding-004"

  # HuggingFace
  HUGGINGFACE_LLM_MODEL: "Qwen/Qwen3.6-35B-A3B"
  HUGGINGFACE_EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"

  # Retrieval / chunking
  FAISS_INDEX_PATH: "/data/faiss_index"
  DEFAULT_TOP_K: "4"
  CHUNK_SIZE: "1000"
  CHUNK_OVERLAP: "200"
  # Max seconds to wait for an LLM generation before timing out (default 1 hour)
  LLM_TIMEOUT: "3600"

  # KPI workflow document storage (nse_data_storage.LocalFileStorage)
  STORAGE_DIR: "/home/storage"

  # PostgreSQL metadata DB (used by the /kpi workflow). DATABASE_URL is assembled
  # from these unless DATABASE_URL is set explicitly. POSTGRES_PASSWORD is a
  # secret and is declared under secretEnv below.
  POSTGRES_HOST: "10.88.0.2"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "iitr-db-test"

# Secret-backed environment variables (API keys). The referenced Secret must contain
# these keys; set existingSecret to use a Secret you manage outside this chart, or
# leave it unset and supply secretValues to have the chart create one for you.
secretEnv:
  # Name of the Secret to mount via envFrom. Auto-generated from the release name if empty.
  existingSecret: ""
  # Keys expected in the Secret (used for documentation / chart-managed Secret creation).
  keys:
    - OPENAI_API_KEY
    - ANTHROPIC_API_KEY
    - VOYAGE_API_KEY
    - GOOGLE_API_KEY
    - HUGGINGFACE_API_KEY
    - POSTGRES_PASSWORD
  # Values used to create the Secret when existingSecret is not set. Leave blank and
  # supply via `--set secretEnv.values.OPENAI_API_KEY=...` or a separate values file —
  # never commit real secrets here.
  values: {}

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
# Force all resource names to exactly this value. Without it Helm prefixes the
# release name to the chart name (e.g. ledger-lens-rag-ledger-lens-rag-chart).
fullnameOverride: "ledger-lens-rag"

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# fsGroup matches the image's app user (uid/gid 1000, see Dockerfile) so the
# mounted PVCs are group-owned and writable by the non-root process. Without
# this, mkdir on /data/storage fails with a permission error.
podSecurityContext:
  fsGroup: 1000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: NodePort
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080
  nodePort: 38080

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 6
readinessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 6

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Persistent storage for the FAISS index (see env.FAISS_INDEX_PATH above).
# When enabled, a PVC is created and mounted at persistence.mountPath so the index
# survives pod restarts/rescheduling. Note: with replicaCount > 1 and accessMode
# ReadWriteOnce, only one pod can write the index — use ReadWriteMany if your
# storage class supports it and you plan to scale beyond 1 replica.
persistence:
  enabled: true
  mountPath: "/data/faiss_index"
  size: 5Gi
  accessMode: ReadWriteOnce
  storageClassName: ""
  # Set to use an existing PVC instead of creating one.
  existingClaim: ""

# Persistent storage for KPI workflow documents (see env.STORAGE_DIR above).
# Mounted at storagePersistence.mountPath, which must match STORAGE_DIR. The
# pod's fsGroup (podSecurityContext.fsGroup) makes this volume writable by the
# non-root app user.
storagePersistence:
  enabled: true
  mountPath: "/data/storage"
  size: 5Gi
  accessMode: ReadWriteOnce
  storageClassName: ""
  # Set to use an existing PVC instead of creating one.
  existingClaim: ""

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
