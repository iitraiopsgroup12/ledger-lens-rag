{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ledger-lens-rag-chart.pvcName" . }}
  labels:
    {{- include "ledger-lens-rag-chart.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  {{- end }}
{{- end }}
{{- if and .Values.storagePersistence.enabled (not .Values.storagePersistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ledger-lens-rag-chart.storagePvcName" . }}
  labels:
    {{- include "ledger-lens-rag-chart.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.storagePersistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.storagePersistence.size }}
  {{- if .Values.storagePersistence.storageClassName }}
  storageClassName: {{ .Values.storagePersistence.storageClassName }}
  {{- end }}
{{- end }}